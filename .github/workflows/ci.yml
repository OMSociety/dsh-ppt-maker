name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 按锁文件安装
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 挂载面核对
        run: npm run check:mounts

      - name: 构建
        run: npm run build

      - name: 构建产物漂移核对
        run: npm run check:build

      # fonts-embed 断言子集字体体积，依赖本机中文字体；云端 runner 取不到，单独在本机跑
      - name: 全量测试（字体嵌入用例除外）
        run: npx vitest run --no-file-parallelism --exclude "tests/fonts-embed.test.ts"
