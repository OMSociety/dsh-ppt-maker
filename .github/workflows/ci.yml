name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 按锁文件安装
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 挂载面核对
        run: npm run check:mounts

      - name: 构建
        run: npm run build

      - name: 构建产物漂移核对
        run: npm run check:build

      - name: 发布物清单
        run: npm run check:pack

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # SVG 页编译器的 Python 环境；svg-page 与 tools-plan-svg 依赖它
      - name: 准备 SVG 编译器环境
        run: node scripts/prepare-vendor-env.mjs
        env:
          PIP_INDEX: https://pypi.org/simple

      # 字体真件用例：Noto CJK 供中文族名解析，文泉驿正黑（glyf 轮廓 TTC）与 DejaVu 供 EOT 封装与嵌入
      - name: 安装测试字体（ubuntu）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei fonts-dejavu-core

      - name: 全量测试
        run: npx vitest run --no-file-parallelism

  # macOS 只验证纯 TS 主链路：安装、类型检查、构建与不依赖渲染器/字体的单元测试
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 按锁文件安装
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 纯 TS 单元测试
        run: npx vitest run --no-file-parallelism tests/package-prune.test.ts tests/reverse-group.test.ts tests/reverse-chart.test.ts tests/client-data-view.test.ts
